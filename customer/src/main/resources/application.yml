server:
  port: 8080

spring:
  application:
    name: customer
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    password: anime_the_best
    url: jdbc:postgresql://localhost:5431/customer
    username: dm4nk
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true


logger:
  enabled: true

logtrace:
  enabled: true
  before-message-prefix: '['
  after-message-prefix: '['

logging:
  level:
    com.dm4nk: info

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
