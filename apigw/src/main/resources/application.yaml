server:
  port: 8099

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/auth/realms/operator
          audiences: operator
  cloud:
    gateway:
      routes:
        - id: customer
          uri: lb://CUSTOMER
          predicates:
            - Path=/api/v1/customer/**
        - id: TRANSACTION
          uri: lb://TRANSACTION
          predicates:
            - Path=/api/v1/transaction/**
        - id: auth
          uri: http://localhost:8180
          predicates:
            - Path=/auth/**

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
